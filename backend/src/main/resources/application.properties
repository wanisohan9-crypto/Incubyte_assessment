spring.application.name=salary-management
server.port=8080

# SQLite
spring.datasource.url=jdbc:sqlite:salary-management.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT (demo secret — override via env var in production)
app.jwt.secret=${JWT_SECRET:acme-salary-management-demo-secret-key-change-me-0123456789}
app.jwt.expiration-ms=86400000

# Seeding
app.seed.enabled=true
app.seed.employees=10000
app.seed.hr-email=hr@company.com
app.seed.hr-password=Password123!

